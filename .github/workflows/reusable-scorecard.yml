name: Scorecard supply-chain security (reusable)

# Reusable OpenSSF Scorecard supply-chain security analysis for tuna-os org repos.
#
# Org-level reusable workflow adopting Hive practice #10 (epic #2250, issue #2260).

on:
  workflow_call:
    inputs:
      publish-results:
        description: Whether to publish results to OpenSSF REST API
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif
