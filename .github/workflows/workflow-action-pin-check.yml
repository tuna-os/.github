name: Workflow action pins (check)

# Validates that every GitHub Actions reference in this repo is pinned to an
# immutable commit SHA (tuna-os/.github#285). A reference at a mutable ref -- a
# branch (@main, @master) or a version tag (@v7.0.1) -- runs whatever code
# exists at that ref on the day CI runs. For third-party actions that is an
# upstream-maintainer (or supply-chain) risk; for a consumer repo calling the
# org's reusable actions and workflows it means a push to tuna-os/.github main
# cascades into that repo.
#
# References into the repository being checked (`--self-repo`) are exempt: in
# tuna-os/.github, `tuna-os/.github/.github/actions/*@main` resolves to the same
# tree as the workflow that calls it, so a SHA pin adds no trust boundary and
# only lets the reference go stale.
#
# A tag or branch ref also passes when .github/workflows/actions.lock (written by
# `gh actions-lock`) pins it for that workflow; actions-security.yml verifies the
# lockfile itself.
#
# To adopt the baseline in a consumer repo, copy this file and
# scripts/check-workflow-action-pins.py into that repo, or call this job from
# an existing CI workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-pin-check:
    name: Workflow action pins
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
      - name: Test the checker and template policy
        run: python3 scripts/test_check_workflow_action_pins.py
      - name: Check workflow action pins
        run: |
          python3 scripts/check-workflow-action-pins.py .github/workflows --self-repo "$GITHUB_REPOSITORY"
          python3 scripts/check-workflow-action-pins.py workflow-templates
          python3 scripts/check-workflow-action-pins.py project-starter/.github/workflows
