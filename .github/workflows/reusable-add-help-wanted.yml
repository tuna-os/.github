name: Add Help Wanted Label (reusable)

# Automatically adds 'help wanted' label to unassigned issues when labeled.
#
# Org-level reusable workflow adopting Hive practice (epic #2250, issue #2260).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  add-help-wanted:
    name: Add Help Wanted
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Process help wanted label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        continue-on-error: true
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const labels = (issue.labels || []).map(l => l.name);
            const hasHelpLabel = labels.some(l =>
              l === 'help wanted' || l === 'good first issue'
            );

            if (hasHelpLabel) {
              console.log('Issue already has help-wanted or good-first-issue label');
              return;
            }

            if (!issue.assignee && !(issue.assignees && issue.assignees.length)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['help wanted']
              });
              console.log('Added help-wanted label to issue #' + issue.number);
            }
