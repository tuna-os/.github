name: Release Verification Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reusable-release-verification.yml"
      - ".github/workflows/release-verification-test.yml"
      - "scripts/test-release-verification.py"
      - "tests/fixtures/release-verification/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reusable-release-verification.yml"
      - ".github/workflows/release-verification-test.yml"
      - "scripts/test-release-verification.py"
      - "tests/fixtures/release-verification/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Fail-closed fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release verification
        run: python3 scripts/test-release-verification.py
