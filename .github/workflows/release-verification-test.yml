name: Release Verification Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reusable-release-verification.yml"
      - ".github/workflows/release-verification-test.yml"
      - "scripts/test-release-verification.py"
      - "tests/fixtures/release-verification/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reusable-release-verification.yml"
      - ".github/workflows/release-verification-test.yml"
      - "scripts/test-release-verification.py"
      - "tests/fixtures/release-verification/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run for the older head. Pushes
# to main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Fail-closed fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test release verification
        run: python3 scripts/test-release-verification.py
